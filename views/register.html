<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - AnhTraiStore</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body { background: linear-gradient(135deg, var(--slate-100) 0%, var(--white) 100%); min-height: 100vh; }
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .auth-card {
            background: var(--white);
            border-radius: var(--radius-2xl);
            padding: 48px 40px;
            width: 100%;
            max-width: 480px;
            box-shadow: var(--shadow-xl);
        }
        .auth-logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .auth-logo a {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--dark);
            text-decoration: none;
        }
        .auth-logo a span { color: var(--primary); }
        .auth-title {
            text-align: center;
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 24px;
            color: var(--dark);
        }
        .auth-alert {
            padding: 14px 16px;
            border-radius: var(--radius-lg);
            margin-bottom: 20px;
            font-size: 0.875rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .auth-alert.error { background: rgba(239, 68, 68, 0.1); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.2); }
        .auth-alert.success { background: rgba(16, 185, 129, 0.1); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.2); }
        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.875rem;
            margin-bottom: 6px;
            color: var(--dark);
        }
        .form-control {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid var(--slate-200);
            border-radius: var(--radius-lg);
            font-size: 0.9rem;
            outline: none;
            transition: all var(--transition-base);
        }
        .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-bg); }
        .btn-auth {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: var(--radius-lg);
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all var(--transition-base);
            box-shadow: 0 4px 14px rgba(79, 70, 229, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-auth:hover { background: var(--primary-dark); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(79, 70, 229, 0.45); }
        .btn-auth:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .auth-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 0.875rem;
            color: var(--slate-500);
        }
        .auth-footer a { color: var(--primary); font-weight: 600; text-decoration: none; }
        .auth-footer a:hover { text-decoration: underline; }
        .form-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
        .password-wrap { position: relative; }
        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: var(--slate-400);
            font-size: 1.1rem;
            padding: 4px;
        }
        .password-toggle:hover { color: var(--primary); }
        @media (max-width: 480px) {
            .auth-card { padding: 32px 24px; }
            .form-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo">
                <a href="/">Anh<span>Trai</span>Store</a>
            </div>
            <h1 class="auth-title">Tạo tài khoản mới</h1>

            <div id="errorMessage" style="display:none" class="auth-alert error">
                <i class="bi bi-exclamation-circle-fill"></i>
                <span id="errorText"></span>
            </div>

            <div id="successMessage" style="display:none" class="auth-alert success">
                <i class="bi bi-check-circle-fill"></i>
                <span>Đăng ký thành công! Đang chuyển hướng...</span>
            </div>

            <form id="registerForm">
                <div class="form-group">
                    <label>Họ và tên *</label>
                    <input type="text" class="form-control" name="full_name" id="fullNameInput" placeholder="Nguyễn Văn A" required>
                </div>
                <div class="form-group">
                    <label>Email *</label>
                    <input type="email" class="form-control" name="email" id="emailInput" placeholder="example@email.com" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Mật khẩu *</label>
                        <div class="password-wrap">
                            <input type="password" class="form-control" name="password" id="passwordInput" placeholder="Tối thiểu 6 ký tự" required style="padding-right:48px">
                            <button type="button" class="password-toggle" onclick="togglePassword('passwordInput', this)">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Xác nhận mật khẩu *</label>
                        <div class="password-wrap">
                            <input type="password" class="form-control" name="confirm_password" id="confirmPasswordInput" placeholder="Nhập lại mật khẩu" required style="padding-right:48px">
                            <button type="button" class="password-toggle" onclick="togglePassword('confirmPasswordInput', this)">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Số điện thoại</label>
                        <input type="tel" class="form-control" name="phone" id="phoneInput" placeholder="0909 xxx xxx">
                    </div>
                    <div class="form-group">
                        <label>Giới tính</label>
                        <select class="form-control" name="gender" id="genderInput">
                            <option value="">Chọn giới tính</option>
                            <option value="male">Nam</option>
                            <option value="female">Nữ</option>
                            <option value="other">Khác</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Ngày sinh</label>
                    <input type="date" class="form-control" name="birthdate" id="birthdateInput">
                </div>
                <button type="submit" class="btn-auth" id="submitBtn">
                    <i class="bi bi-person-plus"></i> Đăng ký tài khoản
                </button>
            </form>

            <div class="auth-footer">
                Đã có tài khoản? <a href="/login">Đăng nhập ngay</a>
            </div>
        </div>
    </div>

    <script>
        function togglePassword(id, btn) {
            const input = document.getElementById(id);
            if (input.type === 'password') {
                input.type = 'text';
                btn.innerHTML = '<i class="bi bi-eye-slash"></i>';
            } else {
                input.type = 'password';
                btn.innerHTML = '<i class="bi bi-eye"></i>';
            }
        }

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorEl = document.getElementById('errorMessage');
            const successEl = document.getElementById('successMessage');
            const errorText = document.getElementById('errorText');
            const submitBtn = document.getElementById('submitBtn');
            errorEl.style.display = 'none';
            successEl.style.display = 'none';

            const fullName = document.getElementById('fullNameInput').value;
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passwordInput').value;
            const confirmPassword = document.getElementById('confirmPasswordInput').value;
            const phone = document.getElementById('phoneInput').value;
            const gender = document.getElementById('genderInput').value;
            const birthdate = document.getElementById('birthdateInput').value;

            if (password.length < 6) {
                errorText.textContent = 'Mật khẩu phải có ít nhất 6 ký tự!';
                errorEl.style.display = 'flex';
                return;
            }

            if (password !== confirmPassword) {
                errorText.textContent = 'Mật khẩu xác nhận không khớp!';
                errorEl.style.display = 'flex';
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="bi bi-arrow-repeat spin"></i> Đang xử lý...';

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ full_name: fullName, email, password, phone, gender, birthdate })
                });

                const data = await response.json();

                if (data.error) {
                    errorText.textContent = data.error;
                    errorEl.style.display = 'flex';
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="bi bi-person-plus"></i> Đăng ký tài khoản';
                    return;
                }

                successEl.style.display = 'flex';
                submitBtn.innerHTML = '<i class="bi bi-check"></i> Thành công!';
                setTimeout(() => window.location.href = '/login', 1500);
            } catch (error) {
                errorText.textContent = 'Đã xảy ra lỗi. Vui lòng thử lại!';
                errorEl.style.display = 'flex';
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="bi bi-person-plus"></i> Đăng ký tài khoản';
            }
        });
    </script>
    <style>.spin { animation: spin 1s linear infinite; } @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }</style>
</body>
</html>
