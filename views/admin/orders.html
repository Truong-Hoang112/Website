<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý đơn hàng - Admin</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
    <div class="admin-wrapper">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <a href="/admin">
                    <div class="sidebar-logo-icon"><i class="fas fa-store"></i></div>
                    <div>
                        <div class="sidebar-logo-text">AnhTraiStore</div>
                        <div class="sidebar-logo-sub">Admin Panel</div>
                    </div>
                </a>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-section">
                    <div class="nav-section-title">Tổng quan</div>
                    <a href="/admin" class="nav-item"><i class="fas fa-chart-pie"></i> Dashboard</a>
                </div>
                <div class="nav-section">
                    <div class="nav-section-title">Quản lý</div>
                    <a href="/admin/products" class="nav-item"><i class="fas fa-box"></i> Sản phẩm</a>
                    <a href="/admin/orders" class="nav-item active"><i class="fas fa-shopping-bag"></i> Đơn hàng</a>
                    <a href="/admin/users" class="nav-item"><i class="fas fa-users"></i> Khách hàng</a>
                    <a href="/admin/reviews" class="nav-item"><i class="fas fa-star"></i> Đánh giá</a>
                    <a href="/admin/contacts" class="nav-item"><i class="fas fa-envelope"></i> Liên hệ</a>
                </div>
                <div class="nav-section">
                    <div class="nav-section-title">Marketing</div>
                    <a href="/admin/banners" class="nav-item"><i class="fas fa-images"></i> Banners</a>
                    <a href="/admin/promotions" class="nav-item"><i class="fas fa-bullhorn"></i> Khuyến mãi</a>
                </div>
                <div class="nav-section">
                    <div class="nav-section-title">Hệ thống</div>
                    <a href="/" class="nav-item" target="_blank"><i class="fas fa-external-link-alt"></i> Xem cửa hàng</a>
                </div>
            </nav>
            <div class="sidebar-footer">
                <div class="sidebar-user" id="adminUser">
                    <div class="sidebar-avatar">A</div>
                    <div class="sidebar-user-info">
                        <div class="sidebar-user-name">Admin</div>
                        <div class="sidebar-user-role">Quản trị viên</div>
                    </div>
                </div>
                <button class="btn-logout" onclick="adminLogout()"><i class="fas fa-sign-out-alt"></i> Đăng xuất</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header">
                <div class="top-header-left">
                    <h1 class="top-header-title">Quản lý đơn hàng</h1>
                </div>
                <div class="top-header-right">
                    <span class="header-date" id="currentDate"></span>
                </div>
            </header>

            <div class="page-content">
                <div id="alertBox"></div>
                
                <!-- Filter -->
                <div class="filter-bar">
                    <button class="filter-btn active" onclick="filterOrders('all')">Tất cả</button>
                    <button class="filter-btn" onclick="filterOrders('pending')">Chờ xác nhận</button>
                    <button class="filter-btn" onclick="filterOrders('confirmed')">Đã xác nhận</button>
                    <button class="filter-btn" onclick="filterOrders('online_paid')">✅ Online</button>
                    <button class="filter-btn" onclick="filterOrders('shipping')">Đang giao</button>
                    <button class="filter-btn" onclick="filterOrders('delivered')">Đã giao</button>
                    <button class="filter-btn" onclick="filterOrders('cancelled')">Đã hủy</button>
                </div>

                <div class="card">
                    <div class="card-body" style="padding: 0;">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Mã đơn</th>
                                    <th>Khách hàng</th>
                                    <th>Sản phẩm</th>
                                    <th>Tổng tiền</th>
                                    <th>Thanh toán</th>
                                    <th>Trạng thái</th>
                                    <th>Ngày đặt</th>
                                    <th style="width: 150px;">Thao tác</th>
                                </tr>
                            </thead>
                            <tbody id="ordersBody">
                                <tr><td colspan="7" style="text-align: center; padding: 48px;"><i class="fas fa-spinner fa-spin" style="font-size: 24px; color: var(--gray-400);"></i></td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Order Detail Modal -->
    <div class="modal-overlay" id="orderModal">
        <div class="modal" style="max-width: 700px;">
            <div class="modal-header">
                <h2 class="modal-title"><i class="fas fa-receipt"></i> Chi tiết đơn hàng</h2>
                <button class="modal-close" onclick="closeOrderModal()"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body" id="orderDetail"></div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeOrderModal()">Đóng</button>
                <button class="btn btn-primary" id="updateStatusBtn" onclick="updateOrderStatus()">
                    <i class="fas fa-save"></i> Cập nhật
                </button>
            </div>
        </div>
    </div>

    <script>
        let currentFilter = 'all';
        let currentOrder = null;

        function showConfirm(title, message, onConfirm) {
            const overlay = document.createElement('div');
            overlay.className = 'confirm-overlay';
            overlay.innerHTML = `<div class="confirm-dialog"><div class="confirm-icon"><i class="fas fa-sign-out-alt"></i></div><div class="confirm-title">${title}</div><div class="confirm-message">${message}</div><div class="confirm-actions"><button class="confirm-btn cancel" onclick="this.closest('.confirm-overlay').remove()">Hủy</button><button class="confirm-btn confirm">Đăng xuất</button></div></div>`;
            document.body.appendChild(overlay);
            overlay.querySelector('.confirm-btn.confirm').onclick = () => { overlay.remove(); onConfirm(); };
            overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
        }
        async function adminLogout() {
            showConfirm('Đăng xuất?', 'Bạn có chắc muốn đăng xuất?', async () => {
                await fetch('/api/auth/logout', { method: 'POST' });
                window.location.href = '/login';
            });
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const now = new Date();
            document.getElementById('currentDate').textContent = now.toLocaleDateString('vi-VN', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' });

            try {
                const userRes = await fetch('/api/auth/me', { credentials: 'include' });
                const userData = await userRes.json();
                if (userData.user) {
                    document.getElementById('adminUser').innerHTML = `<div class="sidebar-avatar">${userData.user.full_name?.charAt(0) || 'A'}</div><div class="sidebar-user-info"><div class="sidebar-user-name">${userData.user.full_name || 'Admin'}</div><div class="sidebar-user-role">Quản trị viên</div></div>`;
                }
            } catch (e) {}

            loadNotificationBadges();
            loadOrders();
        });

        async function loadNotificationBadges() {
            try {
                const res = await fetch('/admin/notifications', { credentials: 'include' });
                const data = await res.json();
                const pendingOrders = data.counts?.pending_orders || 0;
                const contacts = data.counts?.contacts || 0;
                const lowStock = data.low_stock_products?.length || 0;
                
                document.getElementById('navBadgeOrders').textContent = pendingOrders > 0 ? pendingOrders : '';
                document.getElementById('navBadgeOrders').style.display = pendingOrders > 0 ? 'inline-flex' : 'none';
                document.getElementById('navBadgeContacts').textContent = contacts > 0 ? contacts : '';
                document.getElementById('navBadgeContacts').style.display = contacts > 0 ? 'inline-flex' : 'none';
                document.getElementById('navBadgeProducts').textContent = lowStock > 0 ? lowStock : '';
                document.getElementById('navBadgeProducts').style.display = lowStock > 0 ? 'inline-flex' : 'none';
            } catch (e) {}
        }

        function filterOrders(status) {
            currentFilter = status;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            loadOrders();
        }

        async function loadOrders() {
            try {
                const res = await fetch('/admin/orders/list', { credentials: 'include' });
                const data = await res.json();
                let orders = data.orders || [];

                if (currentFilter === 'online_paid') {
                    orders = orders.filter(o => (o.payment_method === 'vnpay' || o.payment_method === 'momo') && o.status === 'confirmed');
                } else if (currentFilter !== 'all') {
                    orders = orders.filter(o => o.status === currentFilter);
                }

                const tbody = document.getElementById('ordersBody');
                if (orders.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="8"><div class="empty-state"><i class="fas fa-inbox"></i><h3>Không có đơn hàng nào</h3></div></td></tr>`;
                    return;
                }

                let html = '';
                orders.forEach(o => {
                    const paymentBadge = getPaymentBadge(o.payment_method);
                    html += `<tr>
                        <td><span class="order-code">${o.payment_code || o.id}</span></td>
                        <td>
                            <strong>${o.customer_name || 'Khách'}</strong><br>
                            <span style="color: var(--gray-500); font-size: 0.8rem;">${o.shipping_phone || ''}</span>
                        </td>
                        <td style="max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${o.items ? o.items.substring(0, 50) + '...' : '-'}</td>
                        <td style="font-weight: 700; color: var(--primary);">${formatPrice(o.total_price)}đ</td>
                        <td>${paymentBadge}</td>
                        <td><span class="status-badge ${o.status}">${getStatusLabel(o.status)}</span></td>
                        <td>${new Date(o.created_at).toLocaleDateString('vi-VN')}</td>
                        <td>
                            <button class="btn btn-sm btn-secondary" onclick="viewOrder(${o.id})"><i class="fas fa-eye"></i></button>
                        </td>
                    </tr>`;
                });
                tbody.innerHTML = html;
            } catch (e) {
                document.getElementById('ordersBody').innerHTML = `<tr><td colspan="8"><div class="empty-state"><i class="fas fa-exclamation-triangle"></i><h3>Lỗi tải dữ liệu</h3></div></td></tr>`;
            }
        }

        function getPaymentBadge(method) {
            if (method === 'vnpay') return '<span class="payment-badge vnpay"><i class="fas fa-credit-card"></i> VNPay</span>';
            if (method === 'momo') return '<span class="payment-badge momo"><i class="fas fa-mobile-alt"></i> MoMo</span>';
            return '<span class="payment-badge cod"><i class="fas fa-truck"></i> COD</span>';
        }

        async function viewOrder(id) {
            try {
                const res = await fetch(`/admin/orders/${id}`, { credentials: 'include' });
                const data = await res.json();
                if (data.order) {
                    currentOrder = data.order;
                    showOrderModal(data.order);
                }
            } catch (e) {
                showAlert('Lỗi tải thông tin đơn hàng!', 'error');
            }
        }

        function showOrderModal(order) {
            const statusOptions = ['pending', 'confirmed', 'shipping', 'delivered', 'cancelled'];
            const statusLabels = { pending: 'Chờ xác nhận', confirmed: 'Đã xác nhận', shipping: 'Đang giao', delivered: 'Đã giao', cancelled: 'Đã hủy' };
            
            let statusHtml = '<select class="form-control" id="orderStatus">';
            statusOptions.forEach(s => {
                statusHtml += `<option value="${s}" ${order.status === s ? 'selected' : ''}>${statusLabels[s]}</option>`;
            });
            statusHtml += '</select>';

            document.getElementById('orderDetail').innerHTML = `
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div>
                        <h4 style="margin-bottom: 12px; color: var(--gray-500); font-size: 0.8rem; text-transform: uppercase;">Thông tin khách hàng</h4>
                        <p><strong>Tên:</strong> ${order.customer_name || 'N/A'}</p>
                        <p><strong>Điện thoại:</strong> ${order.shipping_phone || 'N/A'}</p>
                        <p><strong>Địa chỉ:</strong> ${order.shipping_address || 'N/A'}</p>
                    </div>
                    <div>
                        <h4 style="margin-bottom: 12px; color: var(--gray-500); font-size: 0.8rem; text-transform: uppercase;">Thông tin đơn hàng</h4>
                        <p><strong>Mã đơn:</strong> <span class="order-code">${order.payment_code || order.id}</span></p>
                        <p><strong>Ngày đặt:</strong> ${new Date(order.created_at).toLocaleDateString('vi-VN')}</p>
                        <p><strong>Tổng tiền:</strong> <span style="color: var(--primary); font-weight: 700;">${formatPrice(order.total_price)}đ</span></p>
                        <p><strong>Thanh toán:</strong> ${getPaymentBadge(order.payment_method)}</p>
                    </div>
                </div>
                <div style="margin-top: 20px;">
                    <h4 style="margin-bottom: 12px; color: var(--gray-500); font-size: 0.8rem; text-transform: uppercase;">Cập nhật trạng thái</h4>
                    ${statusHtml}
                </div>
            `;
            
            document.getElementById('orderModal').classList.add('show');
        }

        function closeOrderModal() {
            document.getElementById('orderModal').classList.remove('show');
            currentOrder = null;
        }

        async function updateOrderStatus() {
            if (!currentOrder) return;
            const newStatus = document.getElementById('orderStatus').value;

            try {
                const res = await fetch(`/admin/orders/${currentOrder.id}/status`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'XMLHttpRequest' },
                    credentials: 'include',
                    body: JSON.stringify({ status: newStatus })
                });
                const data = await res.json();
                console.log('Response:', data); // Debug

                if (res.ok && data.success) {
                    showAlert('Cập nhật trạng thái thành công!', 'success');
                    closeOrderModal();
                    loadOrders();
                } else {
                    showAlert(data.error || `Lỗi: ${res.status}`, 'error');
                }
            } catch (e) {
                console.error('Error:', e); // Debug
                showAlert('Lỗi khi cập nhật!', 'error');
            }
        }

        function getStatusLabel(status) {
            const labels = { pending: 'Chờ xác nhận', confirmed: 'Đã xác nhận', shipping: 'Đang giao', delivered: 'Đã giao', cancelled: 'Đã hủy' };
            return labels[status] || status;
        }

        function formatPrice(price) {
            return new Intl.NumberFormat('vi-VN').format(price || 0);
        }

        function showAlert(message, type) {
            const box = document.getElementById('alertBox');
            box.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
            setTimeout(() => { box.innerHTML = ''; }, 3000);
        }

        document.getElementById('orderModal').addEventListener('click', function(e) {
            if (e.target === this) closeOrderModal();
        });
    </script>
    <style>
        .filter-btn { padding: 10px 18px; border: 1.5px solid var(--gray-200); border-radius: var(--radius-md); background: var(--white); font-size: 0.875rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .filter-btn:hover, .filter-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
        .payment-badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; margin-bottom: 4px; }
        .payment-badge.vnpay { background: #e3f2fd; color: #1565c0; }
        .payment-badge.momo { background: #fce4ec; color: #c2185b; }
        .payment-badge.cod { background: #f3e5f5; color: #7b1fa2; }
    </style>
</body>
</html>
