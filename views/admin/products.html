<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý sản phẩm - Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
    <div class="admin-wrapper">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <a href="/admin">
                    <div class="sidebar-logo-icon">
                        <i class="fas fa-store"></i>
                    </div>
                    <div>
                        <div class="sidebar-logo-text">AnhTraiStore</div>
                        <div class="sidebar-logo-sub">Admin Panel</div>
                    </div>
                </a>
            </div>

            <nav class="sidebar-nav">
                <div class="nav-section">
                    <div class="nav-section-title">Tổng quan</div>
                    <a href="/admin" class="nav-item">
                        <i class="fas fa-chart-pie"></i>
                        Dashboard
                    </a>
                </div>

                <div class="nav-section">
                    <div class="nav-section-title">Quản lý</div>
                    <a href="/admin/products" class="nav-item active">
                        <i class="fas fa-box"></i>
                        Sản phẩm
                    </a>
                    <a href="/admin/orders" class="nav-item">
                        <i class="fas fa-shopping-bag"></i>
                        Đơn hàng
                    </a>
                    <a href="/admin/users" class="nav-item">
                        <i class="fas fa-users"></i>
                        Khách hàng
                    </a>
                    <a href="/admin/reviews" class="nav-item">
                        <i class="fas fa-star"></i>
                        Đánh giá
                    </a>
                    <a href="/admin/contacts" class="nav-item">
                        <i class="fas fa-envelope"></i>
                        Liên hệ
                    </a>
                </div>

                <div class="nav-section">
                    <div class="nav-section-title">Hệ thống</div>
                    <a href="/" class="nav-item" target="_blank">
                        <i class="fas fa-external-link-alt"></i>
                        Xem cửa hàng
                    </a>
                </div>
            </nav>

            <div class="sidebar-footer">
                <div class="sidebar-user" id="adminUser">
                    <div class="sidebar-avatar">A</div>
                    <div class="sidebar-user-info">
                        <div class="sidebar-user-name">Admin</div>
                        <div class="sidebar-user-role">Quản trị viên</div>
                    </div>
                </div>
                <button class="btn-logout" onclick="adminLogout()">
                    <i class="fas fa-sign-out-alt"></i>
                    Đăng xuất
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header">
                <div class="top-header-left">
                    <h1 class="top-header-title">Quản lý sản phẩm</h1>
                </div>
                <div class="top-header-right">
                    <span class="header-date" id="currentDate"></span>
                    <button class="btn btn-primary" onclick="openModal()">
                        <i class="fas fa-plus"></i>
                        Thêm sản phẩm
                    </button>
                </div>
            </header>

            <div class="page-content">
                <div id="alertBox"></div>

                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title">
                            <i class="fas fa-list"></i>
                            Danh sách sản phẩm
                        </h2>
                    </div>
                    <div class="card-body" style="padding: 0;">
                        <div style="overflow-x: auto;">
                            <table class="data-table">
                                <thead>
                                    <tr>
                                        <th style="width: 80px;">Ảnh</th>
                                        <th>Tên sản phẩm</th>
                                        <th>Thương hiệu</th>
                                        <th>Giá bán</th>
                                        <th>Tồn kho</th>
                                        <th>Trạng thái</th>
                                        <th style="width: 120px;">Thao tác</th>
                                    </tr>
                                </thead>
                                <tbody id="productsBody">
                                    <tr>
                                        <td colspan="7" style="text-align: center; padding: 48px;">
                                            <i class="fas fa-spinner fa-spin" style="font-size: 24px; color: var(--gray-400);"></i>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="productModal">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">
                    <i class="fas fa-plus-circle"></i>
                    Thêm sản phẩm mới
                </h2>
                <button class="modal-close" onclick="closeModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <form id="productForm">
                    <input type="hidden" id="productId">
                    
                    <div class="form-group">
                        <label class="form-label">Tên sản phẩm <span style="color: var(--danger);">*</span></label>
                        <input type="text" class="form-control" id="name" required placeholder="VD: iPhone 15 Pro Max 256GB">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Thương hiệu <span style="color: var(--danger);">*</span></label>
                            <select class="form-control" id="brand_id" required>
                                <option value="">-- Chọn thương hiệu --</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Danh mục <span style="color: var(--danger);">*</span></label>
                            <select class="form-control" id="category_id" required>
                                <option value="">-- Chọn danh mục --</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Giá niêm yết (VNĐ) <span style="color: var(--danger);">*</span></label>
                            <input type="text" class="form-control" id="price" required placeholder="32.990.000" oninput="formatPriceInput(this); calculateDiscount();">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Giá bán (VNĐ) <span style="color: var(--danger);">*</span></label>
                            <input type="text" class="form-control" id="sale_price" required placeholder="28.990.000" oninput="formatPriceInput(this); calculateDiscount();">
                            <span id="priceError" style="color: var(--danger); font-size: 0.8rem; display: none; margin-top: 4px;"></span>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Tồn kho <span style="color: var(--danger);">*</span></label>
                            <input type="number" class="form-control" id="stock" required placeholder="10" min="0">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Giảm giá</label>
                            <input type="text" class="form-control" id="discount_percent" readonly style="background: rgba(16, 185, 129, 0.1); color: var(--success); font-weight: 700; text-align: center;">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">RAM</label>
                            <select class="form-control" id="ram">
                                <option value="4">4 GB</option>
                                <option value="6">6 GB</option>
                                <option value="8" selected>8 GB</option>
                                <option value="12">12 GB</option>
                                <option value="16">16 GB</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Bộ nhớ</label>
                            <select class="form-control" id="rom">
                                <option value="64">64 GB</option>
                                <option value="128">128 GB</option>
                                <option value="256" selected>256 GB</option>
                                <option value="512">512 GB</option>
                                <option value="1024">1 TB</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Hình ảnh</label>
                        <input type="url" class="form-control" id="thumbnail" placeholder="https://example.com/image.jpg">
                        <span class="form-hint">Nhập URL hình ảnh sản phẩm</span>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Mô tả</label>
                        <textarea class="form-control" id="description" rows="3" placeholder="Mô tả chi tiết về sản phẩm..."></textarea>
                    </div>

                    <div class="form-group">
                        <label class="toggle">
                            <input type="checkbox" id="is_featured">
                            <span class="toggle-slider"></span>
                            <span style="margin-left: 14px; font-weight: 600;">Sản phẩm nổi bật</span>
                        </label>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal()">
                    <i class="fas fa-times"></i>
                    Hủy bỏ
                </button>
                <button class="btn btn-primary" onclick="saveProduct()">
                    <i class="fas fa-save"></i>
                    Lưu sản phẩm
                </button>
            </div>
        </div>
    </div>

    <script>
        let editingId = null;

        async function adminLogout() {
            if (!confirm('Đăng xuất?')) return;
            await fetch('/api/auth/logout', { method: 'POST' });
            window.location.href = '/login';
        }

        document.addEventListener('DOMContentLoaded', async () => {
            // Set date
            const now = new Date();
            const options = { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' };
            document.getElementById('currentDate').textContent = now.toLocaleDateString('vi-VN', options);

            // Load admin user
            try {
                const userRes = await fetch('/api/auth/me', { credentials: 'include' });
                const userData = await userRes.json();
                if (userData.user) {
                    const initial = userData.user.full_name ? userData.user.full_name.charAt(0).toUpperCase() : 'A';
                    document.getElementById('adminUser').innerHTML = `
                        <div class="sidebar-avatar">${initial}</div>
                        <div class="sidebar-user-info">
                            <div class="sidebar-user-name">${userData.user.full_name || 'Admin'}</div>
                            <div class="sidebar-user-role">Quản trị viên</div>
                        </div>`;
                }
            } catch (e) {}

            await Promise.all([
                loadProducts(),
                loadBrands(),
                loadCategories()
            ]);
        });

        async function loadBrands() {
            try {
                const res = await fetch('/api/brands', { credentials: 'include' });
                const data = await res.json();
                if (data.brands) {
                    const select = document.getElementById('brand_id');
                    data.brands.forEach(b => {
                        select.innerHTML += `<option value="${b.id}">${b.name}</option>`;
                    });
                }
            } catch (e) {}
        }

        async function loadCategories() {
            try {
                const res = await fetch('/api/categories', { credentials: 'include' });
                const data = await res.json();
                if (data.categories) {
                    const select = document.getElementById('category_id');
                    data.categories.forEach(c => {
                        select.innerHTML += `<option value="${c.id}">${c.name}</option>`;
                    });
                }
            } catch (e) {}
        }

        function formatPriceInput(input) {
            let value = input.value.replace(/\D/g, '');
            if (value) {
                value = parseInt(value).toLocaleString('vi-VN');
            }
            input.value = value;
        }

        function getRawNumber(formattedValue) {
            return parseInt(formattedValue.replace(/\./g, '')) || 0;
        }

        function calculateDiscount() {
            const price = getRawNumber(document.getElementById('price').value);
            const salePrice = getRawNumber(document.getElementById('sale_price').value);
            const errorDisplay = document.getElementById('priceError');
            
            if (price > 0 && salePrice > 0 && salePrice > price) {
                errorDisplay.textContent = 'Giá bán không được lớn hơn giá niêm yết!';
                errorDisplay.style.display = 'block';
                return;
            }
            
            errorDisplay.style.display = 'none';
            
            if (price > 0 && salePrice > 0 && price > salePrice) {
                const discount = Math.round((1 - salePrice / price) * 100);
                document.getElementById('discount_percent').value = discount + '%';
            } else {
                document.getElementById('discount_percent').value = '0%';
            }
        }

        async function loadProducts() {
            try {
                const response = await fetch('/api/products?limit=100', { credentials: 'include' });
                const data = await response.json();
                const tbody = document.getElementById('productsBody');

                if (!data.products || data.products.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="7"><div class="empty-state"><i class="fas fa-box-open"></i><h3>Chưa có sản phẩm nào</h3><p>Thêm sản phẩm đầu tiên của bạn</p></div></td></tr>`;
                    return;
                }

                let html = '';
                data.products.forEach(p => {
                    const stockClass = p.stock > 10 ? 'badge-success' : p.stock > 0 ? 'badge-warning' : 'badge-danger';
                    const stockText = p.stock > 10 ? 'Còn hàng' : p.stock > 0 ? `Còn ${p.stock}` : 'Hết hàng';
                    const imgSrc = p.thumbnail ? (p.thumbnail.startsWith('http') ? p.thumbnail : '/assets/images/products/' + p.thumbnail) : '';
                    html += `<tr>
                        <td>
                            <img src="${imgSrc}" class="product-img" style="width: 50px; height: 50px; object-fit: cover; border-radius: 8px;" onerror="this.style.display='none'">
                        </td>
                        <td><strong>${p.name}</strong><br><span style="color: var(--gray-500); font-size: 0.8rem;">RAM: ${p.ram || '8GB'} | ROM: ${p.rom || '256GB'}</span></td>
                        <td>${p.brand_name || '-'}</td>
                        <td style="font-weight: 700; color: var(--primary);">${formatPrice(p.price)}đ</td>
                        <td>${p.stock}</td>
                        <td><span class="badge ${stockClass}">${stockText}</span></td>
                        <td>
                            <button class="btn btn-sm btn-secondary" onclick="editProduct(${p.id})" title="Sửa">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="btn btn-sm btn-danger" onclick="deleteProduct(${p.id})" title="Xóa">
                                <i class="fas fa-trash"></i>
                            </button>
                        </td>
                    </tr>`;
                });
                tbody.innerHTML = html;
            } catch (error) {
                document.getElementById('productsBody').innerHTML = `<tr><td colspan="7"><div class="empty-state"><i class="fas fa-exclamation-triangle"></i><h3>Lỗi tải dữ liệu</h3></div></td></tr>`;
            }
        }

        function openModal(id = null) {
            editingId = id;
            const modal = document.getElementById('productModal');
            modal.classList.add('show');
            document.getElementById('modalTitle').innerHTML = id ? '<i class="fas fa-edit"></i> Sửa sản phẩm' : '<i class="fas fa-plus-circle"></i> Thêm sản phẩm mới';
            document.getElementById('productForm').reset();
            document.getElementById('discount_percent').value = '0%';
            document.getElementById('priceError').style.display = 'none';
            document.getElementById('ram').value = '8';
            document.getElementById('rom').value = '256';

            if (id) {
                loadProductData(id);
            }
        }

        function closeModal() {
            const modal = document.getElementById('productModal');
            modal.classList.remove('show');
            editingId = null;
        }

        async function loadProductData(id) {
            try {
                const res = await fetch(`/admin/products/${id}`, {
                    headers: { 'X-Requested-With': 'XMLHttpRequest' },
                    credentials: 'include'
                });
                const data = await res.json();

                if (data.error) {
                    showAlert(data.error, 'error');
                    return;
                }

                const p = data.product;
                document.getElementById('productId').value = p.id;
                document.getElementById('name').value = p.name;
                document.getElementById('brand_id').value = p.brand_id;
                document.getElementById('category_id').value = p.category_id;
                document.getElementById('price').value = p.old_price ? parseInt(p.old_price).toLocaleString('vi-VN') : '';
                document.getElementById('sale_price').value = parseInt(p.price).toLocaleString('vi-VN');
                document.getElementById('stock').value = p.stock;
                document.getElementById('ram').value = p.ram || '8';
                document.getElementById('rom').value = p.rom || '256';
                document.getElementById('thumbnail').value = p.thumbnail || '';
                document.getElementById('description').value = p.description || '';
                document.getElementById('is_featured').checked = p.is_featured == 1;
                
                calculateDiscount();
            } catch (e) {
                showAlert('Lỗi khi tải dữ liệu sản phẩm!', 'error');
            }
        }

        async function saveProduct() {
            const price = getRawNumber(document.getElementById('price').value);
            const salePrice = getRawNumber(document.getElementById('sale_price').value);
            
            if (salePrice > price && price > 0) {
                showAlert('Giá bán không được lớn hơn giá niêm yết!', 'error');
                return;
            }

            const formData = {
                name: document.getElementById('name').value.trim(),
                brand_id: document.getElementById('brand_id').value,
                category_id: document.getElementById('category_id').value,
                price: salePrice || 0,
                old_price: price || 0,
                discount_percent: price > 0 && salePrice > 0 ? Math.round((1 - salePrice / price) * 100) : 0,
                stock: parseInt(document.getElementById('stock').value) || 0,
                ram: document.getElementById('ram').value,
                storage: document.getElementById('rom').value,
                thumbnail: document.getElementById('thumbnail').value.trim() || null,
                description: document.getElementById('description').value.trim() || null,
                is_featured: document.getElementById('is_featured').checked
            };

            if (!formData.name) {
                showAlert('Vui lòng nhập tên sản phẩm!', 'error');
                return;
            }

            try {
                const url = editingId ? `/admin/products/${editingId}` : '/admin/products';
                const method = editingId ? 'PUT' : 'POST';
                
                const res = await fetch(url, {
                    method,
                    headers: { 
                        'Content-Type': 'application/json',
                        'X-Requested-With': 'XMLHttpRequest'
                    },
                    credentials: 'include',
                    body: JSON.stringify(formData)
                });

                const data = await res.json();
                
                if (!res.ok) {
                    if (res.status === 403 || res.status === 401) {
                        showAlert('Phiên đăng nhập hết hạn. Vui lòng đăng nhập lại!', 'error');
                        setTimeout(() => { window.location.href = '/login'; }, 1500);
                        return;
                    }
                    showAlert(data.error || 'Có lỗi xảy ra!', 'error');
                    return;
                }

                if (data.success) {
                    showAlert(editingId ? 'Cập nhật sản phẩm thành công!' : 'Thêm sản phẩm thành công!', 'success');
                    closeModal();
                    loadProducts();
                } else {
                    showAlert(data.error || 'Có lỗi xảy ra!', 'error');
                }
            } catch (e) {
                showAlert('Lỗi khi lưu sản phẩm!', 'error');
            }
        }

        async function editProduct(id) {
            openModal(id);
        }

        async function deleteProduct(id) {
            if (!confirm('Bạn có chắc muốn xóa sản phẩm này?')) return;
            
            try {
                const res = await fetch(`/admin/products/${id}`, {
                    method: 'DELETE',
                    headers: { 'X-Requested-With': 'XMLHttpRequest' },
                    credentials: 'include'
                });

                const data = await res.json();
                
                if (!res.ok) {
                    if (res.status === 403 || res.status === 401) {
                        showAlert('Phiên đăng nhập hết hạn. Vui lòng đăng nhập lại!', 'error');
                        setTimeout(() => { window.location.href = '/login'; }, 1500);
                        return;
                    }
                    showAlert(data.error || 'Xóa thất bại!', 'error');
                    return;
                }
                
                if (data.success) {
                    showAlert('Xóa sản phẩm thành công!', 'success');
                    loadProducts();
                } else {
                    showAlert(data.error || 'Xóa thất bại!', 'error');
                }
            } catch (e) {
                showAlert('Lỗi khi xóa sản phẩm!', 'error');
            }
        }

        function showAlert(message, type) {
            const box = document.getElementById('alertBox');
            box.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
            setTimeout(() => { box.innerHTML = ''; }, 3000);
        }

        function formatPrice(price) {
            if (!price && price !== 0) return '0';
            return new Intl.NumberFormat('vi-VN').format(price);
        }

        // Close modal on outside click
        document.getElementById('productModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });
    </script>
</body>
</html>
