<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý danh mục - Admin</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/css/admin.css?v=20260914-5">
</head>
<body class="admin-shell">
    <div class="admin-wrapper">
        <aside class="sidebar">
            <div class="sidebar-logo">
                <a href="/admin">
                    <div class="sidebar-logo-icon"><i class="fas fa-store"></i></div>
                    <div>
                        <div class="sidebar-logo-text">AnhTraiStore</div>
                        <div class="sidebar-logo-sub">Admin Panel</div>
                    </div>
                </a>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-section"><div class="nav-section-title">Tổng quan</div>
                    <a href="/admin" class="nav-item"><i class="fas fa-chart-pie"></i> Dashboard</a>
                </div>
                <div class="nav-section"><div class="nav-section-title">Quản lý</div>
                    <a href="/admin/products" class="nav-item"><i class="fas fa-box"></i> Sản phẩm</a>
                    <a href="/admin/orders" class="nav-item"><i class="fas fa-shopping-bag"></i> Đơn hàng</a>
                    <a href="/admin/users" class="nav-item"><i class="fas fa-users"></i> Khách hàng</a>
                    <a href="/admin/reviews" class="nav-item"><i class="fas fa-star"></i> Đánh giá</a>
                    <a href="/admin/contacts" class="nav-item"><i class="fas fa-envelope"></i> Liên hệ</a>
                </div>
                <div class="nav-section"><div class="nav-section-title">Marketing</div>
                    <a href="/admin/banners" class="nav-item"><i class="fas fa-images"></i> Banners</a>
                    <a href="/admin/promotions" class="nav-item"><i class="fas fa-bullhorn"></i> Khuyến mãi</a>
                </div>
                <div class="nav-section"><div class="nav-section-title">Hệ thống</div>
                    <a href="/" class="nav-item" target="_blank"><i class="fas fa-external-link-alt"></i> Xem cửa hàng</a>
                </div>
            </nav>
            <div class="sidebar-footer">
                <div class="sidebar-user" id="adminUser">
                    <div class="sidebar-avatar">A</div>
                    <div class="sidebar-user-info">
                        <div class="sidebar-user-name">Admin</div>
                        <div class="sidebar-user-role">Quản trị viên</div>
                    </div>
                </div>
                <button class="btn-logout" onclick="adminLogout()"><i class="fas fa-sign-out-alt"></i> Đăng xuất</button>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <div class="top-header-left">
                    <h1 class="top-header-title">Quản lý danh mục</h1>
                </div>
                <div class="top-header-right">
                    <span class="header-date" id="currentDate"></span>
                    <button class="btn btn-primary" onclick="openModal()">
                        <i class="fas fa-plus"></i> Thêm danh mục
                    </button>
                </div>
            </header>

            <div class="page-content">
                <div id="alertBox"></div>
                
                <div class="card">
                    <div class="card-body" style="padding: 0;">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th style="width: 60px;">#</th>
                                    <th>Tên danh mục</th>
                                    <th>Slug</th>
                                    <th style="width: 150px;">Thao tác</th>
                                </tr>
                            </thead>
                            <tbody id="categoriesBody">
                                <tr><td colspan="4" style="text-align: center; padding: 48px;"><i class="fas fa-spinner fa-spin" style="font-size: 24px; color: var(--gray-400);"></i></td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="categoryModal">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle"><i class="fas fa-folder"></i> Thêm danh mục</h2>
                <button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <form id="categoryForm">
                    <input type="hidden" id="categoryId">
                    <div class="form-group">
                        <label class="form-label">Tên danh mục <span style="color: var(--danger);">*</span></label>
                        <input type="text" class="form-control" id="categoryName" required placeholder="VD: Điện thoại, Tablet">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Slug</label>
                        <input type="text" class="form-control" id="categorySlug" placeholder="auto-generated-from-name">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal()">Hủy bỏ</button>
                <button class="btn btn-primary" onclick="saveCategory()"><i class="fas fa-save"></i> Lưu</button>
            </div>
        </div>
    </div>

    <script>
        let editingId = null;
        let categoriesCache = [];

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, char => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[char]);
        }

        async function adminLogout() {
            showConfirm('Đăng xuất?', 'Bạn có chắc muốn đăng xuất?', async () => {
                await fetch('/api/auth/logout', { method: 'POST' });
                window.location.href = '/login';
            });
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const now = new Date();
            document.getElementById('currentDate').textContent = now.toLocaleDateString('vi-VN', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' });
            try {
                const userRes = await fetch('/api/auth/me', { credentials: 'include' });
                const userData = await userRes.json();
                if (userData.user) {
                    document.getElementById('adminUser').innerHTML = `<div class="sidebar-avatar">${userData.user.full_name?.charAt(0) || 'A'}</div><div class="sidebar-user-info"><div class="sidebar-user-name">${userData.user.full_name || 'Admin'}</div><div class="sidebar-user-role">Quản trị viên</div></div>`;
                }
            } catch (e) {}
            loadCategories();

            document.getElementById('categoryName').addEventListener('input', function() {
                document.getElementById('categorySlug').value = this.value.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
            });
        });

        async function loadCategories() {
            try {
                const res = await fetch('/api/categories', { credentials: 'include' });
                const data = await res.json();
                const categories = data.categories || [];
                categoriesCache = categories;
                const tbody = document.getElementById('categoriesBody');

                if (categories.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="4"><div class="empty-state"><i class="fas fa-folder"></i><h3>Chưa có danh mục nào</h3></div></td></tr>`;
                    return;
                }

                let html = '';
                categories.forEach((c, i) => {
                    html += `<tr>
                        <td>${i + 1}</td>
                        <td><strong>${escapeHtml(c.name)}</strong></td>
                        <td><code style="font-size: 0.8rem;">${escapeHtml(c.slug)}</code></td>
                        <td>
                            <button class="btn btn-sm btn-secondary" onclick="editCategory(${c.id})"><i class="fas fa-edit"></i></button>
                            <button class="btn btn-sm btn-danger" onclick="deleteCategory(${c.id})"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>`;
                });
                tbody.innerHTML = html;
            } catch (e) {
                document.getElementById('categoriesBody').innerHTML = `<tr><td colspan="4"><div class="empty-state"><i class="fas fa-exclamation-triangle"></i><h3>Lỗi tải dữ liệu</h3></div></td></tr>`;
            }
        }

        function openModal() {
            editingId = null;
            document.getElementById('modalTitle').innerHTML = '<i class="fas fa-plus-circle"></i> Thêm danh mục';
            document.getElementById('categoryForm').reset();
            document.getElementById('categoryId').value = '';
            document.getElementById('categoryModal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('categoryModal').classList.remove('show');
            editingId = null;
        }

        function editCategory(id) {
            const category = categoriesCache.find(item => Number(item.id) === Number(id));
            if (!category) return;
            editingId = id;
            document.getElementById('modalTitle').innerHTML = '<i class="fas fa-edit"></i> Sửa danh mục';
            document.getElementById('categoryId').value = id;
            document.getElementById('categoryName').value = category.name;
            document.getElementById('categorySlug').value = category.slug;
            document.getElementById('categoryModal').classList.add('show');
        }

        async function saveCategory() {
            const name = document.getElementById('categoryName').value.trim();
            const slug = document.getElementById('categorySlug').value.trim() || name.toLowerCase().replace(/[^a-z0-9]+/g, '-');
            const currentCategory = categoriesCache.find(item => Number(item.id) === Number(editingId));
            const is_active = currentCategory ? (Number(currentCategory.is_active) === 0 ? 0 : 1) : 1;

            if (!name) {
                showAlert('Vui lòng nhập tên danh mục!', 'error');
                return;
            }

            try {
                const url = editingId ? `/api/categories/${editingId}` : '/api/categories';
                const method = editingId ? 'PUT' : 'POST';
                const res = await fetch(url, {
                    method,
                    headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'XMLHttpRequest' },
                    credentials: 'include',
                    body: JSON.stringify({ name, slug, is_active })
                });

                const data = await res.json();

                if (res.ok) {
                    showAlert(editingId ? 'Cập nhật thành công!' : 'Thêm thành công!', 'success');
                    closeModal();
                    loadCategories();
                } else {
                    showAlert(data.error || 'Có lỗi xảy ra!', 'error');
                }
            } catch (e) {
                showAlert('Lỗi khi lưu!', 'error');
            }
        }

        async function deleteCategory(id) {
            const confirmed = await adminConfirm({
                title: 'Xóa danh mục?',
                message: 'Danh mục chỉ được xóa khi không còn sản phẩm tham chiếu.',
                confirmText: 'Xóa danh mục',
                icon: 'fa-trash-alt'
            });
            if (!confirmed) return;
            try {
                const res = await fetch(`/api/categories/${id}`, {
                    method: 'DELETE',
                    headers: { 'X-Requested-With': 'XMLHttpRequest' },
                    credentials: 'include'
                });
                const data = await res.json();
                if (res.ok) {
                    showAlert('Xóa thành công!', 'success');
                    loadCategories();
                } else {
                    showAlert(data.error || 'Không thể xóa danh mục!', 'error');
                }
            } catch (e) {
                showAlert('Lỗi khi xóa!', 'error');
            }
        }

        function showAlert(message, type) {
            const box = document.getElementById('alertBox');
            box.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
            setTimeout(() => { box.innerHTML = ''; }, 3000);
        }

        document.getElementById('categoryModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });
    </script>
    <script src="/js/admin-ui.js?v=20260914-4"></script>
</body>
</html>
