<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt lại mật khẩu - Anh Trai Ban DT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome-6.5.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body { background: linear-gradient(135deg, var(--slate-100) 0%, var(--white) 100%); min-height: 100vh; }
        .auth-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
        .auth-card { background: var(--white); border-radius: var(--radius-2xl); padding: 48px 40px; width: 100%; max-width: 440px; box-shadow: var(--shadow-xl); }
        .auth-logo { text-align: center; margin-bottom: 32px; }
        .auth-logo a { font-size: 1.5rem; font-weight: 800; color: var(--dark); text-decoration: none; }
        .auth-logo a span { color: var(--primary); }
        .auth-title { text-align: center; font-size: 1.5rem; font-weight: 800; margin-bottom: 24px; color: var(--dark); }
        .auth-alert { padding: 14px 16px; border-radius: var(--radius-lg); margin-bottom: 20px; font-size: 0.875rem; font-weight: 500; display: flex; align-items: center; gap: 10px; }
        .auth-alert.error { background: rgba(239, 68, 68, 0.1); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.2); }
        .auth-alert.success { background: rgba(16, 185, 129, 0.1); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.2); }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 600; font-size: 0.875rem; margin-bottom: 6px; color: var(--dark); }
        .form-control { width: 100%; padding: 14px 16px; border: 2px solid var(--slate-200); border-radius: var(--radius-lg); font-size: 0.9rem; outline: none; transition: all var(--transition-base); }
        .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-bg); }
        .btn-auth { width: 100%; padding: 16px; background: var(--primary); color: #fff; border: none; border-radius: var(--radius-lg); font-size: 1rem; font-weight: 700; cursor: pointer; transition: all var(--transition-base); box-shadow: 0 4px 14px rgba(79, 70, 229, 0.35); display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-auth:hover { background: var(--primary-dark); transform: translateY(-2px); }
        .btn-auth:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .auth-footer { text-align: center; margin-top: 24px; font-size: 0.875rem; color: var(--slate-500); }
        .auth-footer a { color: var(--primary); font-weight: 600; text-decoration: none; }
        @media (max-width: 480px) { .auth-card { padding: 32px 24px; } }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="topbar-inner">
            <span class="topbar-item"><i class="bi bi-shield-check"></i> Hàng chính hãng 100%</span>
            <span class="topbar-item"><i class="bi bi-truck"></i> Miễn phí ship đơn từ 500K</span>
            <span class="topbar-item"><i class="bi bi-arrow-repeat"></i> Đổi trả trong 30 ngày</span>
        </div>
    </div>

    <div class="auth-wrap">
        <div class="auth-card">
            <div class="auth-logo">
                <a href="/">Anh Trai Ban DT</a>
            </div>
            <h1 class="auth-title">Đặt lại mật khẩu</h1>

            <div id="errorMessage" style="display:none" class="auth-alert error">
                <i class="bi bi-exclamation-circle-fill"></i>
                <span id="errorText"></span>
            </div>
            <div id="successMessage" style="display:none" class="auth-alert success">
                <i class="bi bi-check-circle-fill"></i>
                <span>Đổi mật khẩu thành công!</span>
            </div>

            <form class="auth-form" id="resetForm">
                <input type="hidden" id="tokenInput" value="">
                <div class="form-group">
                    <label>Mật khẩu mới</label>
                    <input type="password" id="passwordInput" placeholder="Tối thiểu 6 ký tự" required minlength="6">
                </div>
                <div class="form-group">
                    <label>Xác nhận mật khẩu</label>
                    <input type="password" id="confirmInput" placeholder="Nhập lại mật khẩu" required minlength="6">
                </div>
                <button type="submit" class="btn-auth" id="submitBtn">
                    <i class="bi bi-key"></i> Đổi mật khẩu
                </button>
            </form>

            <div class="auth-footer">
                <a href="/login">Quay lại đăng nhập</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Get token from URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        document.getElementById('tokenInput').value = token || '';

        if (!token) {
            document.getElementById('errorMessage').style.display = 'flex';
            document.getElementById('errorText').textContent = 'Liên kết không hợp lệ hoặc đã hết hạn!';
            document.getElementById('resetForm').style.display = 'none';
        }

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorEl = document.getElementById('errorMessage');
            const successEl = document.getElementById('successMessage');
            const submitBtn = document.getElementById('submitBtn');

            errorEl.style.display = 'none';
            successEl.style.display = 'none';

            const password = document.getElementById('passwordInput').value;
            const confirm = document.getElementById('confirmInput').value;

            if (password !== confirm) {
                document.getElementById('errorText').textContent = 'Mật khẩu xác nhận không khớp!';
                errorEl.style.display = 'flex';
                return;
            }

            if (password.length < 6) {
                document.getElementById('errorText').textContent = 'Mật khẩu phải có ít nhất 6 ký tự!';
                errorEl.style.display = 'flex';
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="bi bi-hourglass-split"></i> Đang xử lý...';

            try {
                const response = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        token: token,
                        password: password
                    })
                });

                const data = await response.json();

                if (data.error) {
                    document.getElementById('errorText').textContent = data.error;
                    errorEl.style.display = 'flex';
                } else {
                    successEl.style.display = 'flex';
                    document.getElementById('resetForm').style.display = 'none';
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 2000);
                }
            } catch (error) {
                document.getElementById('errorText').textContent = 'Đã xảy ra lỗi. Vui lòng thử lại!';
                errorEl.style.display = 'flex';
            }

            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="bi bi-key"></i> Đổi mật khẩu';
        });
    </script>
    <script>document.addEventListener('DOMContentLoaded', function(){fetch('/components/ai-chatbox.html').then(r=>r.text()).then(h=>{var root=document.getElementById('aiChatboxRoot');if(root)root.innerHTML=h;});});</script>
    <div id="aiChatboxRoot"></div>
</body>
</html>
